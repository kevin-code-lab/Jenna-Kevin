        body {
            font-family: 'Montserrat', sans-serif;

        }

        }
        .pinyon-font {
            font-family: 'Pinyon Script', cursive;
        }
        /* Parallax only works well on Desktop */
        .parallax {
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        @media (min-width: 768px) {
            .parallax {
                background-attachment: fixed;
            }
        }
        
        /* Custom scrollbar - Moss Green Theme */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #F9F8F4; }
        ::-webkit-scrollbar-thumb { background: #7C9070; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #2C4A34; }
        
        /* Fade In Animation */
        .fade-in {
            animation: fadeIn 1.5s ease-in forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Floating Blobs Animation */
        @keyframes float {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: float 20s infinite ease-in-out;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }

        /* Gold Foil Text Effect */
        .text-gold {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% auto;
            animation: shine 6s linear infinite;
            padding-bottom: 0.2em; /* Extra padding to prevent cut-off */
            padding-top: 0.1em;
            line-height: 1.4;
        }
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        /* Float Up Animation for Intro */
        @keyframes floatUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .animate-float-up {
            animation: floatUp 1.5s ease-out forwards;
        }

        .perspective-2000 { perspective: 2000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
    </style>

        // --- PARALLAX COMPONENT ---
        const ParallaxImage = ({ src, alt, className, onClick, children }) => {
            const containerRef = useRef(null);
            const imgRef = useRef(null);

            useEffect(() => {
                let frameId = null;

                const updateParallax = () => {
                    if (!containerRef.current || !imgRef.current) return;
                    try {
                        const rect = containerRef.current.getBoundingClientRect();
                        const viewportHeight = window.innerHeight;

                        if (rect.top < viewportHeight && rect.bottom > 0) {
                            const speed = 15; 
                            const percentage = (rect.top + rect.height / 2 - viewportHeight / 2) / (viewportHeight / 2);
                            const move = percentage * speed;
                            imgRef.current.style.transform = `scale(1.1) translateY(${move}px)`;
                        }
                    } catch (e) {}
                };

                const onScroll = () => {
                    if (!frameId) {
                        frameId = requestAnimationFrame(() => {
                            updateParallax();
                            frameId = null;
                        });
                    }
                };

                window.addEventListener('scroll', onScroll, { passive: true });
                setTimeout(updateParallax, 100); 

                return () => {
                    window.removeEventListener('scroll', onScroll);
                    if (frameId) cancelAnimationFrame(frameId);
                };
            }, []);

            return (
                <div 
                    ref={containerRef}
                    className={`overflow-hidden relative ${className}`}
                    onClick={onClick}
                >
                    <img 
                        ref={imgRef}
                        src={src} 
                        alt={alt}

                        loading="lazy"
                    />

              <div className="absolute inset-0 bg-cover bg-center parallax z-0" style={{ backgroundImage: `url('/website-header.jpg')` }} />
              <div className="absolute inset-0 bg-gradient-to-b from-stone-900/40 via-stone-900/10 to-[#2C4A34]/90 z-10" />
              
              <div className="relative z-20 text-white px-4 max-w-4xl pt-16 md:pt-0">
                <p className="text-[10px] md:text-sm uppercase tracking-[0.5em] mb-4 opacity-90 font-light">Save the Date • September 26, 2026</p>
                <h1 className="pinyon-font text-5xl md:text-9xl mb-2 drop-shadow-xl text-gold w-full px-8 py-6 leading-relaxed">Jenna <span className="serif not-italic">&amp;</span> Kevin</h1>
                <p className="text-sm md:text-xl font-light tracking-widest uppercase mb-8 md:mb-12 border-y border-white/20 py-4 inline-block px-8 text-[#F9F8F4]">Antipolo City</p>
                
                <div className="flex justify-center gap-3 md:gap-8 mt-2">
                  {[
                    { label: 'Days', val: timeLeft.days }, { label: 'Hrs', val: timeLeft.hours },
                    { label: 'Mins', val: timeLeft.minutes }, { label: 'Secs', val: timeLeft.seconds },
                  ].map((item) => (
                    <div key={item.label} className="bg-[#2C4A34]/30 backdrop-blur-md border border-[#F9F8F4]/30 rounded-lg p-2 md:p-6 w-14 md:w-28 transition-transform hover:scale-105 shadow-lg">
                      <span className="block text-lg md:text-3xl font-bold text-[#F9F8F4]">{item.val.toString().padStart(2, '0')}</span>
                      <span className="text-[8px] md:text-xs uppercase tracking-widest text-[#F9F8F4] opacity-80">{item.label}</span>
                    </div>
                  ))}
                </div>
                
                <div className="mt-8 md:mt-12 flex flex-col items-center gap-4">
                  <a href="#rsvp" className="inline-block bg-[#E6DCC5] text-[#2C4A34] px-8 py-3 md:px-10 md:py-4 rounded-full font-semibold uppercase text-[10px] md:text-xs tracking-[0.2em] shadow-lg hover:bg-white transition-all transform hover:-translate-y-1 active:scale-95">RSVP Our Special Day</a>
                  <a href={googleCalendarUrl} target="_blank" rel="noreferrer" className="text-[#F9F8F4] text-[10px] uppercase tracking-widest hover:text-[#E6DCC5] underline underline-offset-4 transition-colors opacity-80 hover:opacity-100">+ Add to Google Calendar</a>
                </div>
              </div>
            </header>
          );
        };

        const PasswordGate = ({ onUnlock }) => {
            const [input, setInput] = useState('');
            const [error, setError] = useState(false);
            const PASSWORD = "JK2026"; 

            const handleSubmit = (e) => {
                e.preventDefault();
                if (input.toUpperCase() === PASSWORD) {
                    onUnlock();
                } else {
                    setError(true);
                    setInput('');
                }
            }

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-stone-900">
                    <div className="absolute inset-0 bg-cover bg-center" style={{ backgroundImage: `url('/passwordpage.JPG')` }} />
                    <div className="absolute inset-0 bg-black/40 backdrop-blur-[2px]" />
                    <div className="relative z-10 bg-[#F9F8F4]/80 backdrop-blur-md p-10 rounded-2xl shadow-2xl max-w-sm w-full mx-4 text-center border border-white/50">
                        <div className="serif text-4xl text-[#2C4A34] mb-2">J & K</div>
                        <p className="text-[#7C9070] text-xs uppercase tracking-widest mb-8">September 26, 2026</p>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input type="password" placeholder="Enter Passcode" value={input} onChange={(e) => { setInput(e.target.value); setError(false); }} className="w-full text-center p-3 border-b-2 border-[#7C9070] bg-transparent outline-none focus:border-[#2C4A34] transition-colors text-[#2C4A34] placeholder-stone-400" />
                            {error && <p className="text-red-800 text-xs font-semibold">Incorrect Passcode</p>}
                            <button type="submit" className="w-full bg-[#2C4A34] text-[#F9F8F4] py-3 rounded-full font-bold uppercase text-xs tracking-widest hover:bg-[#7C9070] transition-colors">Enter Site</button>
                        </form>
                    </div>
                </div>
            );
        };

        const App = () => {
          const [viewState, setViewState] = useState('LOCKED'); 
          const [lightboxSrc, setLightboxSrc] = useState(null);

          const handleUnlock = () => setViewState('INTRO');
          const handleIntroComplete = () => setViewState('SITE');

          return (
            <>
              {viewState === 'LOCKED' && <PasswordGate onUnlock={handleUnlock} />}
              {viewState === 'INTRO' && <IntroSequence onComplete={handleIntroComplete} />}
              {viewState === 'SITE' && (
                <div className="min-h-screen relative fade-in">
                  <BackgroundMusic />
                  <PaperTexture />
                  <FloatingBlobs />
                  <Lightbox src={lightboxSrc} onClose={() => setLightboxSrc(null)} />
                  <BackToTop />
                  <div className="fixed inset-0 pointer-events-none -z-10 opacity-5" style={{ backgroundImage: `url('https://images.unsplash.com/photo-1675129442933-bbf5b814e6e8?q=80&w=687&auto=format&fit=crop')`, backgroundSize: 'cover', backgroundPosition: 'center', backgroundAttachment: 'fixed', filter: 'grayscale(1) contrast(1.1)' }} />
                  <Navbar />
                  <main className="overflow-x-hidden">
                    <Header />
                    <div className="max-w-6xl mx-auto px-4 md:px-8 space-y-12 md:space-y-24 py-12">
                      <Story />
                      <Details />
                      <Entourage />
                      <Memories />
                      <Registry />
                      <RSVP />
                      <Gallery openLightbox={setLightboxSrc} />
                      <FAQ />
                    </div>
                  </main>
                  <footer className="py-12 bg-[#2C4A34] text-[#F9F8F4] text-center">
                    <p className="serif text-2xl mb-2">J & K</p>
                    <p className="text-sm font-light tracking-widest uppercase opacity-70">September 26, 2026 • Antipolo City</p>
                    <div className="mt-8 border-t border-[#7C9070]/30 pt-8 max-w-xs mx-auto">
                      <p className="text-xs opacity-40">&copy; 2026 Jenna & Kevin's Wedding. All Rights Reserved.</p>
                    </div>
                  </footer>
                </div>
              )}
            </>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
