        .parallax {
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        @media (min-width: 768px) {

            }

            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Floating Blobs Animation */
        @keyframes float {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: float 20s infinite ease-in-out;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;

            background-clip: text;
            color: transparent;
            background-size: 200% auto;

        }

        // --- OPTIMIZED PARALLAX COMPONENT ---
        const ParallaxImage = ({ src, alt, className, onClick, children }) => {
            const containerRef = useRef(null);
            const imgRef = useRef(null);

            useEffect(() => {
                let frameId = null;

                const updateParallax = () => {
                    if (!containerRef.current || !imgRef.current) return;
                    
                    try {
                        const rect = containerRef.current.getBoundingClientRect();
                        const viewportHeight = window.innerHeight;

                        if (rect.top < viewportHeight && rect.bottom > 0) {
                            const speed = 15; 
                            const percentage = (rect.top + rect.height / 2 - viewportHeight / 2) / (viewportHeight / 2);
                            const move = percentage * speed;
                            
                            imgRef.current.style.transform = `scale(1.1) translateY(${move}px)`;
                        }
                    } catch (e) {}
                };

                const onScroll = () => {
                    if (!frameId) {
                        frameId = requestAnimationFrame(() => {
                            updateParallax();
                            frameId = null;
                        });
                    }
                };

                window.addEventListener('scroll', onScroll, { passive: true });
                setTimeout(updateParallax, 100); 

                return () => {
                    window.removeEventListener('scroll', onScroll);
                    if (frameId) cancelAnimationFrame(frameId);
                };
            }, []);

            return (
                <div 
                    ref={containerRef}
                    className={`overflow-hidden relative ${className}`}
                    onClick={onClick}
                >
                    <img 
                        ref={imgRef}
                        src={src} 
                        alt={alt}
                        className="w-full h-full object-cover will-change-transform scale-110"
                        loading="lazy"
                    />
                    {children}

            );

                         className="flex items-center gap-2 bg-stone-100 hover:bg-[#2C4A34] hover:text-white px-4 py-2 rounded-full transition-all duration-300 group"
                      >
                         {!copied && (
                             <svg className="w-4 h-4 text-stone-400 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" /></svg>
                         )}
                         <span className={`text-xs font-semibold ${copied ? 'text-green-600 group-hover:text-white' : 'text-stone-500 group-hover:text-white'}`}>
                            {copied ? "Number Copied!" : "Copy GCash Number"}
                         </span>
                      </button>
                      
                   </div>
                </div>
              </div>
            </SectionWrapper>
          );
        };

        const RSVP = () => {
          return (
            <SectionWrapper id="rsvp" title="Kindly RSVP">
              <div className="max-w-2xl mx-auto bg-white/70 backdrop-blur-md p-12 rounded-[2rem] shadow-xl border border-white/40 text-center relative overflow-hidden">
                <div className="absolute top-0 right-0 w-32 h-32 opacity-5 pointer-events-none">
                  <svg viewBox="0 0 100 100" fill="currentColor" className="text-[#2C4A34]">
                     <path d="M10,90 Q50,10 90,90" />
                  </svg>
                </div>

                <p className="text-2xl serif italic text-[#2C4A34] mb-4">We'd love to celebrate with you!</p>
                <p className="text-stone-500 font-light mb-8">
                  Please let us know if you can join us by<br />
                  <span className="font-semibold text-[#2C4A34]">August 26, 2026</span>
                </p>

                <a 
                  href="https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAANAAfi-kJdUNVVJOFNPR0FKRjFPRTdRM1RKSk42MDNYOC4u" 
                  target="_blank"
                  rel="noopener noreferrer"
                  className="inline-block bg-[#2C4A34] text-[#F9F8F4] px-12 py-5 rounded-full font-bold uppercase text-xs tracking-[0.3em] hover:bg-[#7C9070] transition-all shadow-xl"
                >
                  Confirm Attendance
                </a>
                
                <p className="mt-8 text-xs text-stone-400 italic">
                  For any dietary requirements, please include them in the form.
                </p>
              </div>
            </SectionWrapper>
          );
        };

        const FAQ = () => {
          const [openIndex, setOpenIndex] = useState(null);

          const faqs = [
            {
              question: "Is parking available at the Ceremony and Reception venues?",
              answer: "Yes. There is parking available in front of the Immaculate Heart of Mary, and there is also parking inside The Emerald Events Place."
            },
            {
              question: "Can we bring kids to the event?",
              answer: "We respectfully request that no kids or toddlers attend the event to ensure an intimate and relaxed celebration for everyone."
            },
            {
              question: "Can we bring a plus one?",
              answer: "Seats and attendees are very limited. We appreciate if you strictly follow the allocation indicated in your invitation."
            }
          ];

          return (
            <SectionWrapper id="faq" title="Frequently Asked Questions">
              <div className="max-w-2xl mx-auto space-y-4 text-left">
                {faqs.map((item, idx) => (
                  <div key={idx} className="bg-white/70 backdrop-blur-sm border border-[#E6DCC5] rounded-2xl overflow-hidden shadow-sm transition-all hover:shadow-md">
                    <button 
                      onClick={() => setOpenIndex(openIndex === idx ? null : idx)}
                      className="w-full flex justify-between items-center p-6 text-left focus:outline-none"
                    >
                      <span className="serif text-lg text-[#2C4A34] font-medium pr-4">{item.question}</span>
                      <span className={`text-[#7C9070] transform transition-transform duration-300 ${openIndex === idx ? 'rotate-180' : ''}`}>
                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
                        </svg>
                      </span>
                    </button>
                    <div 
                      className={`transition-all duration-500 ease-in-out overflow-hidden ${
                        openIndex === idx ? 'max-h-40 opacity-100' : 'max-h-0 opacity-0'
                      }`}
                    >
                      <div className="p-6 pt-0 text-stone-600 font-light leading-relaxed border-t border-[#F9F8F4]">
                        {item.answer}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </SectionWrapper>
          );
        };

        // --- UPDATED: PASSWORD GATE (FIXED POSITIONING) ---
        const PasswordGate = ({ onUnlock }) => {
            const [input, setInput] = useState('');
            const [error, setError] = useState(false);
            
            const PASSWORD = "JK2026"; 

            const handleSubmit = (e) => {
                e.preventDefault();
                if (input.toUpperCase() === PASSWORD) {
                    onUnlock();
                } else {
                    setError(true);
                    setInput('');
                }
            }

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-stone-900">
                    <div 
                        className="absolute inset-0 bg-cover bg-center"
                        style={{ backgroundImage: `url('./passwordpage.JPG')` }}
                    />
                    <div className="absolute inset-0 bg-black/30" />
                    
                    <div className="relative z-10 bg-[#F9F8F4]/80 backdrop-blur-md p-10 rounded-2xl shadow-2xl max-w-sm w-full mx-4 text-center border border-white/50">
                        <div className="serif text-4xl text-[#2C4A34] mb-2">J & K</div>
                        <p className="text-[#7C9070] text-xs uppercase tracking-widest mb-8">September 26, 2026</p>
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input 
                                type="password" 
                                placeholder="Enter Passcode"
                                value={input}
                                onChange={(e) => {
                                    setInput(e.target.value);
                                    setError(false);
                                }}
                                className="w-full text-center p-3 border-b-2 border-[#7C9070] bg-transparent outline-none focus:border-[#2C4A34] transition-colors text-[#2C4A34] placeholder-stone-400"
                            />
                            {error && <p className="text-red-800 text-xs font-semibold">Incorrect Passcode</p>}
                            
                            <button 
                                type="submit"
                                className="w-full bg-[#2C4A34] text-[#F9F8F4] py-3 rounded-full font-bold uppercase text-xs tracking-widest hover:bg-[#7C9070] transition-colors"
                            >
                                Enter Site
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const App = () => {
          const [viewState, setViewState] = useState('LOCKED'); 
          const [lightboxSrc, setLightboxSrc] = useState(null);

          const handleUnlock = () => {
              setViewState('INTRO');
          };

          const handleIntroComplete = () => {
              setViewState('SITE');
          };

          return (
            <>
              {viewState === 'LOCKED' && <PasswordGate onUnlock={handleUnlock} />}
              
              {viewState === 'INTRO' && <IntroSequence onComplete={handleIntroComplete} />}

              {viewState === 'SITE' && (
                <div className="min-h-screen relative fade-in">
                  <BackgroundMusic />
                  
                  <PaperTexture />
                  <FloatingBlobs />
                  <Lightbox src={lightboxSrc} onClose={() => setLightboxSrc(null)} />
                  
                  <BackToTop />

                  <div 
                    className="fixed inset-0 pointer-events-none -z-10 opacity-5"
                    style={{
                      backgroundImage: `url('https://images.unsplash.com/photo-1675129442933-bbf5b814e6e8?q=80&w=687&auto=format&fit=crop')`,
                      backgroundSize: 'cover',
                      backgroundPosition: 'center',
                      backgroundAttachment: 'fixed',
                      filter: 'grayscale(1) contrast(1.1)'
                    }}
                  />
                  
                  <Navbar />
                  
                  <main className="overflow-x-hidden">
                    <Header />
                    
                    <div className="max-w-6xl mx-auto px-4 md:px-8 space-y-12 md:space-y-24 py-12">
                      <Story />
                      <Details />
                      <Entourage />
                      <Memories openLightbox={setLightboxSrc} />
                      <Registry />
                      <RSVP />
                      <Gallery openLightbox={setLightboxSrc} />
                      <FAQ />
                    </div>
                  </main>

                  <footer className="py-12 bg-[#2C4A34] text-[#F9F8F4] text-center">
                    <p className="serif text-2xl mb-2">J & K</p>
                    <p className="text-sm font-light tracking-widest uppercase opacity-70">
                      September 26, 2026 • Antipolo City
                    </p>
                    <div className="mt-8 border-t border-[#7C9070]/30 pt-8 max-w-xs mx-auto">
                      <p className="text-xs opacity-40">
                        &copy; 2026 Jenna & Kevin's Wedding. All Rights Reserved.
                      </p>
                    </div>
                  </footer>
                </div>
              )}
            </>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
